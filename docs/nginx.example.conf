# Example nginx config for TransportSim. See SELF_HOSTING.md.
#
# Assumes the server runs on the same machine with `PORT=8787 bun run start`
# (it serves the built client and the game WebSocket at /ws), and that
# certificates come from certbot. Replace play.example.com with your domain.
#
# Put this file in /etc/nginx/conf.d/ (or sites-available/ plus a symlink in
# sites-enabled/), then run `nginx -t && systemctl reload nginx`.

upstream transportsim {
    server 127.0.0.1:8787;
    keepalive 16;
}

# Pass the WebSocket upgrade through, and keep plain requests on keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;

    # certbot's HTTP-01 challenge, if you use the webroot plugin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.example.com;

    ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The Bun server doesn't compress static files, so nginx does. Game traffic
    # on /ws is compressed in the game's own codec and is unaffected.
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Game connections. After the upgrade nginx relays frames as they come and
    # doesn't limit their size (client_max_body_size doesn't apply), so a host
    # can upload a large save. The server itself accepts messages up to 96 MB.
    location = /ws {
        proxy_pass http://transportsim;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # nginx closes a connection that is quiet for this long. Players get
        # updates ten times a second, and the server pings idle sockets within
        # its 120 s idle timeout, so this only needs to be longer than that.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # /health lists every running game by its join code, private games too,
    # so keep it to local monitoring.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://transportsim;
        proxy_set_header Connection "";
    }

    # Vite puts a content hash in every file name under /assets/, so they can
    # be cached for good.
    location /assets/ {
        proxy_pass http://transportsim;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html and anything else (unknown paths fall back to index.html).
    # Revalidate, so players pick up a new build as soon as it is deployed.
    location / {
        proxy_pass http://transportsim;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache";
    }
}
